<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="uiBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080D"/>
      <stop offset="60%" stop-color="#141103"/>
      <stop offset="100%" stop-color="#020306"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#uiBg1)"/>

  <!-- Left: Mobile Frame Mockup -->
  <g transform="translate(140, 100)">
    <rect width="320" height="600" rx="36" fill="#0C0D12" stroke="#FACC15" stroke-width="2.5"/>
    <!-- Speaker notch -->
    <rect x="110" y="16" width="100" height="18" rx="9" fill="#1C1E24"/>
    
    <!-- Mobile Screen UI Content -->
    <g transform="translate(24, 60)">
      <text x="0" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#71717A">SMART HOME</text>
      <text x="0" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">Lumina Energy</text>
      
      <!-- Energy Meter Circle -->
      <circle cx="136" cy="160" r="75" fill="#141203" stroke="#332B06" stroke-width="12"/>
      <circle cx="136" cy="160" r="75" fill="none" stroke="#FACC15" stroke-width="12" stroke-dasharray="350" stroke-dashoffset="110" stroke-linecap="round"/>
      <text x="136" y="155" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle">3.2 kW</text>
      <text x="136" y="180" font-family="monospace" font-size="11" fill="#FACC15" text-anchor="middle">OPTIMAL LOAD</text>

      <!-- Quick Toggles -->
      <g transform="translate(0, 270)">
        <rect width="128" height="80" rx="14" fill="#1C1803" stroke="#FACC15" stroke-width="1"/>
        <text x="16" y="32" font-family="sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold">HVAC Climate</text>
        <text x="16" y="56" font-family="monospace" font-size="11" fill="#FACC15">Off-Peak (Eco)</text>

        <rect x="144" width="128" height="80" rx="14" fill="#14161C" stroke="#272A34" stroke-width="1"/>
        <text x="160" y="32" font-family="sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold">EV Charger</text>
        <text x="160" y="56" font-family="monospace" font-size="11" fill="#71717A">Paused till 23:00</text>
      </g>

      <!-- Bottom card -->
      <rect y="370" width="272" height="110" rx="14" fill="#131103" stroke="#EAB308" stroke-width="1"/>
      <text x="16" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FEF08A">AI Cost Savings Today</text>
      <text x="16" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">₹ 142.50 (24%)</text>
      <text x="16" y="85" font-family="monospace" font-size="11" fill="#10B981">&gt; Appliance shift enabled</text>
    </g>
  </g>

  <!-- Right: Desktop Tablet Screen Mockup -->
  <g transform="translate(540, 160)">
    <rect width="540" height="480" rx="20" fill="#0E1017" stroke="#252A36" stroke-width="2"/>
    <rect x="0" y="0" width="540" height="44" rx="20" fill="#161A24"/>
    <circle cx="28" cy="22" r="5" fill="#EF4444"/>
    <circle cx="46" cy="22" r="5" fill="#FACC15"/>
    <circle cx="64" cy="22" r="5" fill="#10B981"/>
    <text x="90" y="27" font-family="monospace" font-size="12" fill="#A1A1AA">lumina.energy/dashboard/analytics</text>

    <!-- Desktop Dashboard UI -->
    <g transform="translate(30, 75)">
      <text x="0" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">Energy Telemetry &amp; Tariff Curve</text>
      <rect y="45" width="480" height="160" rx="12" fill="#08090C" stroke="#212530"/>
      <!-- Curve -->
      <path d="M 20 150 Q 80 160 140 100 T 260 70 T 380 130 T 460 60" fill="none" stroke="#FACC15" stroke-width="3"/>
      <circle cx="460" cy="60" r="6" fill="#FACC15"/>
      <circle cx="460" cy="60" r="12" fill="none" stroke="#FACC15" opacity="0.5"/>

      <!-- KPI row -->
      <g transform="translate(0, 230)">
        <rect width="145" height="85" rx="10" fill="#171504" stroke="#FACC15" stroke-width="1"/>
        <text x="16" y="28" font-family="monospace" font-size="10" fill="#FACC15">PEAK DEMAND</text>
        <text x="16" y="58" font-family="sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">4.8 kW</text>

        <rect x="165" width="145" height="85" rx="10" fill="#0D0F14" stroke="#252A36" stroke-width="1"/>
        <text x="181" y="28" font-family="monospace" font-size="10" fill="#A1A1AA">GRID STATUS</text>
        <text x="181" y="58" font-family="sans-serif" font-size="18" font-weight="bold" fill="#10B981">Stable 50Hz</text>

        <rect x="330" width="150" height="85" rx="10" fill="#0D0F14" stroke="#252A36" stroke-width="1"/>
        <text x="346" y="28" font-family="monospace" font-size="10" fill="#A1A1AA">MONTHLY EST.</text>
        <text x="346" y="58" font-family="sans-serif" font-size="18" font-weight="bold" fill="#FDE047">-₹ 1,840</text>
      </g>
    </g>
  </g>
</svg>
