<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="workBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07060A"/>
      <stop offset="60%" stop-color="#141103"/>
      <stop offset="100%" stop-color="#020203"/>
    </linearGradient>
    <linearGradient id="figmaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#workBg)"/>

  <!-- Figma Style Component Wireframe Floating Nodes -->
  <g transform="translate(720, 160)">
    <!-- Component card 1 -->
    <rect width="360" height="180" rx="12" fill="#131003" stroke="#FACC15" stroke-width="1.5" stroke-opacity="0.7"/>
    <text x="24" y="38" font-family="monospace" font-size="11" fill="#FACC15">❖ Button / Primary / Hover</text>
    <rect x="24" y="60" width="140" height="42" rx="8" fill="#FACC15"/>
    <text x="94" y="86" font-family="sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">Click Me</text>
    <rect x="180" y="60" width="140" height="42" rx="8" fill="none" stroke="#FACC15" stroke-width="1.5"/>
    <text x="250" y="86" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FACC15" text-anchor="middle">Outline</text>
    <line x1="24" y1="130" x2="336" y2="130" stroke="#332B07"/>
    <text x="24" y="156" font-family="monospace" font-size="11" fill="#A1A1AA">Tokens: color-primary-400 • radius-md</text>

    <!-- Component card 2 (Offset below) -->
    <g transform="translate(-60, 220)">
      <rect width="380" height="200" rx="12" fill="#0B0902" stroke="#EAB308" stroke-width="1.5" stroke-dasharray="6,4"/>
      <text x="24" y="38" font-family="monospace" font-size="11" fill="#FEF08A">❖ Navigation Bar / Responsive</text>
      <!-- Nav items mock -->
      <rect x="24" y="60" width="332" height="46" rx="8" fill="#1A1504"/>
      <circle cx="50" cy="83" r="12" fill="#FACC15"/>
      <rect x="74" y="77" width="60" height="12" rx="4" fill="#66540A"/>
      <rect x="220" y="77" width="40" height="12" rx="4" fill="#EAB308"/>
      <rect x="275" y="73" width="65" height="20" rx="6" fill="#FACC15"/>
      <text x="307" y="87" font-family="sans-serif" font-size="10" font-weight="bold" fill="#000000" text-anchor="middle">Action</text>
      <text x="24" y="145" font-family="monospace" font-size="11" fill="#71717A">Auto-layout: Horizontal • Gap: 16px • Resizing: Fill</text>
      <text x="24" y="172" font-family="monospace" font-size="11" fill="#FACC15">&gt; Tested on 375px mobile and 1440px desktop</text>
    </g>
  </g>

  <!-- Typography Left Side -->
  <g transform="translate(120, 160)">
    <rect width="180" height="30" rx="15" fill="#2B2303" stroke="#FACC15" stroke-width="1"/>
    <text x="90" y="20" font-family="monospace" font-size="11" fill="#FACC15" text-anchor="middle" font-weight="bold">
      WORKSHOP SERIES
    </text>

    <text x="0" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" letter-spacing="-1">
      ZERO TO UI/UX
    </text>
    <text x="0" y="165" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="700" fill="#FACC15">
      Modern Design Systems &amp; Figma Mastery
    </text>

    <text x="0" y="225" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" fill="#D4D4D8">
      <tspan x="0" dy="0">Hands-on collegiate masterclass teaching wireframing, color theory,</tspan>
      <tspan x="0" dy="28">typography tokens, auto-layout, and code-ready handoff workflows.</tspan>
    </text>

    <g transform="translate(0, 310)">
      <text x="0" y="0" font-family="monospace" font-size="12" fill="#71717A">INSTRUCTOR</text>
      <text x="0" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">Supriya Suresh</text>
      <text x="0" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#FACC15">Creative Lead &amp; Frontend Engineer</text>

      <text x="260" y="0" font-family="monospace" font-size="12" fill="#71717A">TOOLS COVERED</text>
      <text x="260" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">Figma • Framer • Tokens</text>
      <text x="260" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#FACC15">From Wireframe to Production</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(120, 720)">
    <text x="0" y="0" font-family="monospace" font-size="12" fill="#71717A">
      POSTER DESIGNED IN FIGMA • SOCIAL PROMOTIONAL CAMPAIGN
    </text>
    <text x="960" y="0" font-family="monospace" font-size="12" fill="#FACC15" font-weight="bold" text-anchor="end">
      SUPRIVERSE POSTER ARCHIVE #06
    </text>
  </g>
</svg>
