<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="summitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09080A"/>
      <stop offset="60%" stop-color="#191504"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="warmYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#summitBg)"/>

  <!-- Bauhaus Graphic Composition on Right -->
  <g transform="translate(850, 400)">
    <!-- Giant Half Arc -->
    <path d="M 0 -260 A 260 260 0 0 1 0 260 Z" fill="#FACC15"/>
    <!-- Nested Slices -->
    <circle cx="-60" cy="0" r="160" fill="#1C1805" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="-60" cy="0" r="90" fill="url(#warmYellow)"/>
    <circle cx="-60" cy="0" r="30" fill="#000000"/>
    
    <!-- Geometric decorative squares -->
    <rect x="-240" y="-180" width="80" height="80" fill="none" stroke="#FDE047" stroke-width="2"/>
    <rect x="-220" y="100" width="120" height="120" fill="#282205" stroke="#EAB308" stroke-width="1.5"/>
    <line x1="-300" y1="-260" x2="-300" y2="260" stroke="#FACC15" stroke-width="2" stroke-dasharray="8,6"/>
  </g>

  <!-- Typography Left Side -->
  <g transform="translate(120, 160)">
    <text x="0" y="20" font-family="monospace" font-size="14" fill="#FACC15" letter-spacing="3" font-weight="bold">
      CREATIVE CONCLAVE // VOL. IV
    </text>

    <text x="0" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-size="76" font-weight="900" fill="#FFFFFF" letter-spacing="-2">
      DESIGN
    </text>
    <text x="0" y="195" font-family="'Plus Jakarta Sans', sans-serif" font-size="76" font-weight="900" fill="#FACC15" letter-spacing="-2">
      DISRUPT
    </text>

    <text x="0" y="250" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="600" fill="#E4E4E7">
      Redefining Visual Systems, Branding &amp; UI
    </text>

    <text x="0" y="310" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" fill="#A1A1AA">
      <tspan x="0" dy="0">Exploring the convergence of generative visual systems,</tspan>
      <tspan x="0" dy="26">product design, editorial posters, and brand architecture.</tspan>
    </text>

    <!-- Keynote Pillars -->
    <g transform="translate(0, 390)">
      <circle cx="6" cy="6" r="4" fill="#FACC15"/>
      <text x="24" y="10" font-family="sans-serif" font-size="14" fill="#F4F4F5" font-weight="bold">Keynote 01: Typographic Expression in Digital Spaces</text>

      <circle cx="6" cy="42" r="4" fill="#FACC15"/>
      <text x="24" y="46" font-family="sans-serif" font-size="14" fill="#F4F4F5" font-weight="bold">Keynote 02: Design Systems from Figma to Production Code</text>

      <circle cx="6" cy="78" r="4" fill="#FACC15"/>
      <text x="24" y="82" font-family="sans-serif" font-size="14" fill="#F4F4F5" font-weight="bold">Keynote 03: Brand Identity for AI-Driven Products</text>
    </g>
  </g>

  <!-- Footer Tag -->
  <g transform="translate(120, 720)">
    <text x="0" y="0" font-family="monospace" font-size="12" fill="#71717A">
      CURATED BY SUPRIYA SURESH • TOOLS: FIGMA &amp; CORELDRAW
    </text>
    <text x="960" y="0" font-family="monospace" font-size="12" fill="#FACC15" font-weight="bold" text-anchor="end">
      SUPRIVERSE POSTER ARCHIVE #03
    </text>
  </g>
</svg>
