<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B17"/>
      <stop offset="50%" stop-color="#0A1835"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <radialGradient id="radialAccent" cx="65%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect width="800" height="450" fill="url(#radialAccent)"/>

  <!-- Technical Grid -->
  <g opacity="0.12" stroke="#38BDF8" stroke-width="1">
    <path d="M0 75 H800 M0 150 H800 M0 225 H800 M0 300 H800 M0 375 H800"/>
    <path d="M100 0 V450 M200 0 V450 M300 0 V450 M400 0 V450 M500 0 V450 M600 0 V450 M700 0 V450"/>
  </g>

  <!-- Energy Wave & Circuit Nodes -->
  <path d="M 80 280 Q 200 120 320 240 T 560 200 T 720 150" fill="none" stroke="url(#blueGlow)" stroke-width="3" filter="url(#glow)"/>
  <path d="M 80 300 Q 220 200 360 290 T 600 230 T 720 180" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.6"/>

  <!-- AI Energy Core Node -->
  <g transform="translate(520, 190)">
    <circle r="46" fill="#0E214A" stroke="#2563EB" stroke-width="2" filter="url(#glow)"/>
    <circle r="34" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="6,4"/>
    <circle r="18" fill="#2563EB" opacity="0.8"/>
    <!-- Energy Spark Icon -->
    <path d="M -2 -14 L 6 -2 L 1 0 L 4 14 L -6 2 L -1 0 Z" fill="#FFFFFF"/>
  </g>

  <!-- Connected Subnodes -->
  <g stroke="#38BDF8" stroke-width="1.5">
    <line x1="520" y1="190" x2="320" y2="240" opacity="0.5"/>
    <line x1="520" y1="190" x2="660" y2="120" opacity="0.4"/>
    <line x1="520" y1="190" x2="480" y2="330" opacity="0.4"/>
  </g>
  <circle cx="320" cy="240" r="6" fill="#38BDF8"/>
  <circle cx="660" cy="120" r="5" fill="#60A5FA"/>
  <circle cx="480" cy="330" r="5" fill="#2563EB"/>

  <!-- Telemetry Badge Card -->
  <g transform="translate(60, 60)">
    <rect width="260" height="90" rx="8" fill="#0A1324" fill-opacity="0.85" stroke="#1E3A8A" stroke-width="1"/>
    <text x="20" y="32" font-family="monospace" font-size="12" fill="#38BDF8" font-weight="bold">AI_TELEMETRY // OPTIMIZED</text>
    <text x="20" y="56" font-family="sans-serif" font-size="18" fill="#F8FAFC" font-weight="700">Peak Load -24.3%</text>
    <text x="20" y="74" font-family="sans-serif" font-size="11" fill="#94A3B8">Dynamic Agent Dispatch</text>
    <circle cx="236" cy="30" r="4" fill="#10B981"/>
  </g>

  <!-- Code Snippet Decorator -->
  <g transform="translate(60, 360)">
    <text x="0" y="0" font-family="monospace" font-size="12" fill="#64748B">
      &gt; agent.optimize(power_grid, target="off_peak", comfort=0.95)
    </text>
    <text x="0" y="20" font-family="monospace" font-size="12" fill="#38BDF8">
      &gt; status: 200 OK | state: AUTONOMOUS_CONTROL_ACTIVE
    </text>
  </g>
</svg>
