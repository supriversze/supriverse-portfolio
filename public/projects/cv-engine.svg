<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020817"/>
      <stop offset="50%" stop-color="#07193C"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#cvBg)"/>

  <!-- Scanning Reticle Lines -->
  <g stroke="#2563EB" stroke-width="1" opacity="0.3">
    <circle cx="480" cy="225" r="140" fill="none" stroke-dasharray="8,6"/>
    <circle cx="480" cy="225" r="90" fill="none"/>
    <line x1="480" y1="55" x2="480" y2="395"/>
    <line x1="310" y1="225" x2="650" y2="225"/>
  </g>

  <!-- Bounding Boxes (Computer Vision Target Detection) -->
  <g stroke="#38BDF8" stroke-width="2" fill="none">
    <rect x="420" y="160" width="110" height="110" rx="4"/>
    <!-- Corner brackets -->
    <path d="M 412 170 V 152 H 430" stroke="#60A5FA" stroke-width="3"/>
    <path d="M 538 170 V 152 H 520" stroke="#60A5FA" stroke-width="3"/>
    <path d="M 412 260 V 278 H 430" stroke="#60A5FA" stroke-width="3"/>
    <path d="M 538 260 V 278 H 520" stroke="#60A5FA" stroke-width="3"/>
  </g>
  
  <rect x="420" y="138" width="110" height="18" fill="#2563EB"/>
  <text x="426" y="152" font-family="monospace" font-size="11" fill="#FFFFFF" font-weight="bold">TARGET: 98.4%</text>

  <!-- Left Stats Info Card -->
  <g transform="translate(80, 100)">
    <rect width="250" height="240" rx="10" fill="#0A1428" fill-opacity="0.9" stroke="#1D4ED8" stroke-width="1.2"/>
    <text x="24" y="38" font-family="monospace" font-size="12" fill="#38BDF8" font-weight="bold">CNN_INFERENCE // ACTIVE</text>
    
    <text x="24" y="75" font-family="sans-serif" font-size="28" font-weight="800" fill="#F8FAFC">94.6%</text>
    <text x="24" y="98" font-family="sans-serif" font-size="12" fill="#94A3B8">Validation Accuracy (mAP)</text>

    <line x1="24" y1="120" x2="226" y2="120" stroke="#1E293B"/>

    <text x="24" y="145" font-family="monospace" font-size="12" fill="#E2E8F0">Feature Maps: 512</text>
    <text x="24" y="172" font-family="monospace" font-size="12" fill="#E2E8F0">Inference: 14.2ms</text>
    <text x="24" y="199" font-family="monospace" font-size="12" fill="#10B981">&gt; Grad-CAM Heatmap: OK</text>
  </g>

  <!-- Heatmap Simulation Dots -->
  <g fill="#EF4444" opacity="0.3">
    <circle cx="470" cy="210" r="28" filter="blur(6px)"/>
    <circle cx="490" cy="220" r="20" filter="blur(4px)"/>
  </g>
</svg>
