<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="mernBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040914"/>
      <stop offset="60%" stop-color="#0A1835"/>
      <stop offset="100%" stop-color="#02040A"/>
    </linearGradient>
    <linearGradient id="mernAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#mernBg)"/>

  <!-- Matrix Grid -->
  <g opacity="0.08" stroke="#60A5FA" stroke-width="1">
    <path d="M0 50 H800 M0 100 H800 M0 150 H800 M0 200 H800 M0 250 H800 M0 300 H800 M0 350 H800 M0 400 H800"/>
    <path d="M80 0 V450 M160 0 V450 M240 0 V450 M320 0 V450 M400 0 V450 M480 0 V450 M560 0 V450 M640 0 V450 M720 0 V450"/>
  </g>

  <!-- Mockup Window / Glass Card -->
  <g transform="translate(180, 55)">
    <rect width="480" height="320" rx="12" fill="#0B132B" fill-opacity="0.9" stroke="#1E3A8A" stroke-width="1.5" filter="url(#blurFilter)"/>
    <!-- Window Controls -->
    <circle cx="24" cy="24" r="5" fill="#EF4444"/>
    <circle cx="42" cy="24" r="5" fill="#F59E0B"/>
    <circle cx="60" cy="24" r="5" fill="#10B981"/>
    <line x1="0" y1="46" x2="480" y2="46" stroke="#1E293B" stroke-width="1"/>
    
    <!-- Code Editor UI Simulation -->
    <rect x="24" y="65" width="120" height="12" rx="4" fill="#1E3A8A" opacity="0.5"/>
    <text x="24" y="105" font-family="monospace" font-size="12" fill="#38BDF8">const server = express();</text>
    <text x="24" y="128" font-family="monospace" font-size="12" fill="#94A3B8">mongoose.connect(MONGO_URI);</text>
    <text x="24" y="151" font-family="monospace" font-size="12" fill="#60A5FA">app.use('/api/v1', router);</text>

    <!-- Schema card inside window -->
    <g transform="translate(240, 75)">
      <rect width="210" height="130" rx="8" fill="#060F24" stroke="#2563EB" stroke-width="1"/>
      <text x="16" y="26" font-family="monospace" font-size="11" fill="#38BDF8">&lt;MERN_SCHEMA /&gt;</text>
      <text x="16" y="52" font-family="monospace" font-size="11" fill="#E2E8F0">User { _id, email, hash }</text>
      <text x="16" y="74" font-family="monospace" font-size="11" fill="#E2E8F0">Tasks [ status, due, tag ]</text>
      <text x="16" y="96" font-family="monospace" font-size="11" fill="#10B981">&gt; indexed: true (0.04ms)</text>
    </g>

    <!-- Metrics bar -->
    <rect x="24" y="235" width="432" height="55" rx="6" fill="#08142C" stroke="#1E3A8A" stroke-width="1"/>
    <text x="40" y="268" font-family="sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">REST Latency: 84ms</text>
    <text x="240" y="268" font-family="sans-serif" font-size="13" font-weight="600" fill="#38BDF8">Lighthouse: 99/100</text>
  </g>

  <!-- Side Badge -->
  <g transform="translate(60, 160)">
    <circle cx="40" cy="40" r="32" fill="#0B1C40" stroke="#2563EB" stroke-width="2"/>
    <text x="40" y="45" font-family="sans-serif" font-size="12" font-weight="bold" fill="#38BDF8" text-anchor="middle">MERN</text>
  </g>
</svg>
